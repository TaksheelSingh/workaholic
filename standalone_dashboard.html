<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>workaholic. — Attendance & Leave Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const LEAVE_TYPES = {
      OFFICE: { key: 'OFFICE', name: 'In Office Work', hex: '#34D399' },
      WFH: { key: 'WFH', name: 'Work From Home', hex: '#047857' },
      PL: { key: 'PL', name: 'Privilege Leave', hex: '#1D4ED8' },
      SL: { key: 'SL', name: 'Sick / Casual Leave', hex: '#0EA5E9' },
      PH: { key: 'PH', name: 'Public Holiday', hex: '#F97316' },
      OPH: { key: 'OPH', name: 'Optional Public Holiday', hex: '#EAB308' },
      MD: { key: 'MD', name: 'My Day', hex: '#A855F7' },
      OD: { key: 'OD', name: 'On Duty', hex: '#EF4444' },
      SHL: { key: 'SHL', name: 'Short Leave', hex: '#B45309' }
    };
    const LEAVE_KEYS = Object.keys(LEAVE_TYPES);
    const DROPDOWN_KEYS = LEAVE_KEYS;
    const getHex = (k) => LEAVE_TYPES[k] ? LEAVE_TYPES[k].hex : '#E5E7EB';

    const INITIAL_LEAVES = {};

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function App() {
      const [isDark, setIsDark] = React.useState(false);
      const [year, setYear] = React.useState(2026);
      const [monthIdx, setMonthIdx] = React.useState(8);
      const [leaves, setLeaves] = React.useState(INITIAL_LEAVES);
      const [modal, setModal] = React.useState({ open: false, dateStr: null, entry: null });

      const toggleTheme = () => {
        setIsDark(!isDark);
        if (!isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      };

      const monthKey = `${year}-${String(monthIdx+1).padStart(2,'0')}`;
      const metrics = {};
      LEAVE_KEYS.forEach(k => metrics[k] = { full: 0, half: 0, total: 0 });
      Object.entries(leaves).forEach(([d, entry]) => {
        if (d.startsWith(monthKey)) {
          if (entry.type === 'full' && metrics[entry.category]) metrics[entry.category].full += 1;
          else if (entry.type === 'half') {
            if (entry.half1 && metrics[entry.half1]) metrics[entry.half1].half += 1;
            if (entry.half2 && metrics[entry.half2]) metrics[entry.half2].half += 1;
          }
        }
      });
      LEAVE_KEYS.forEach(k => metrics[k].total = (metrics[k].full * 1.0 + metrics[k].half * 0.5));

      const daysInMonth = new Date(year, monthIdx+1, 0).getDate();
      const firstDay = new Date(year, monthIdx, 1).getDay();
      const calDays = [];
      for(let i=0; i<firstDay; i++) calDays.push(null);
      for(let d=1; d<=daysInMonth; d++) calDays.push(d);

      const handleDateClick = (dStr, entry) => {
        if (!entry) {
          setLeaves(prev => ({ ...prev, [dStr]: { type: 'full', category: 'OFFICE' } }));
        } else {
          setModal({ open: true, dateStr: dStr, entry: entry });
        }
      };

      const handleSave = (dateStr, entryData) => {
        setLeaves(prev => ({ ...prev, [dateStr]: entryData }));
        try { confetti({ particleCount: 35, spread: 60, origin: { y: 0.7 } }); } catch(e){}
        setModal({ open: false, dateStr: null, entry: null });
      };

      const handleResetDay = (dateStr) => {
        setLeaves(prev => { const n = {...prev}; delete n[dateStr]; return n; });
        setModal({ open: false, dateStr: null, entry: null });
      };

      return (
        <div className="flex flex-col md:flex-row h-full w-full overflow-x-hidden bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
          {/* Sidebar */}
          <aside className="w-full md:w-[240px] bg-white dark:bg-gray-900 border-b md:border-b-0 md:border-r border-gray-100 dark:border-gray-800 p-4 md:px-[18px] md:py-[24px] flex flex-row md:flex-col justify-between flex-shrink-0">
            <div className="flex flex-row md:flex-col items-center md:items-stretch justify-between w-full md:w-auto space-y-0 md:space-y-8">
              <div className="flex items-center justify-between w-auto md:w-full space-x-3 md:space-x-0">
                <span className="text-xl md:text-2xl font-black text-gray-900 dark:text-white">workaholic<span className="text-indigo-600">.</span></span>
                <button onClick={toggleTheme} className="p-1.5 rounded-full text-amber-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition cursor-pointer">
                  {isDark ? '☀️' : '🌙'}
                </button>
              </div>

              <div className="hidden md:block">
                <span className="text-[11px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest block mb-4 px-3">MAIN</span>
                <nav className="space-y-2">
                  <button className="w-full text-left px-4 py-2.5 rounded-full text-xs font-bold border border-indigo-500/30 bg-indigo-50/70 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 shadow-sm hover:bg-indigo-100 dark:hover:bg-indigo-900/60 hover:shadow-md transition cursor-pointer">
                    Dashboard
                  </button>
                </nav>
              </div>
            </div>

            {/* Profile badge */}
            <div className="p-2.5 md:p-3 rounded-full bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-800 flex items-center space-x-3 hover:bg-gray-100 dark:hover:bg-gray-800/90 hover:shadow-md transition cursor-pointer">
              <div className="w-7 h-7 md:w-8 md:h-8 rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-300 font-bold flex items-center justify-center text-xs">TR</div>
              <div>
                <div className="text-xs font-bold text-gray-900 dark:text-white">Taksheel Rawat</div>
                <div className="text-[10px] text-gray-400 dark:text-gray-500">Local User</div>
              </div>
            </div>
          </aside>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-gray-50 dark:bg-gray-950">
            <header className="px-6 md:px-8 py-6 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800">
              <div>
                <h1 className="text-2xl md:text-3xl font-black text-gray-900 dark:text-white">Dashboard</h1>
                <p className="text-xs font-medium text-gray-400 dark:text-gray-400 mt-1">Real-time leave balances, half-day allocations, and monthly attendance tracking.</p>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 md:space-y-8 bg-gray-50 dark:bg-gray-950 flex flex-col justify-between">
              <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                
                {/* Central Calendar (6 Cols Desktop) */}
                <div className="xl:col-span-6 bg-white dark:bg-gray-900 rounded-3xl p-4 sm:p-6 md:p-8 border border-gray-100 dark:border-gray-800 shadow-sm space-y-6">
                  {/* Middle Aligned Month & Year Header */}
                  <div className="flex items-center justify-between px-2 sm:px-4 pb-4 border-b border-gray-100 dark:border-gray-800">
                    <button onClick={() => setMonthIdx(m => m === 0 ? 11 : m - 1)} className="w-10 h-10 rounded-2xl bg-gray-50 dark:bg-gray-800 flex items-center justify-center font-bold hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer flex-shrink-0">‹</button>
                    
                    <div className="flex flex-col items-center justify-center text-center mx-auto">
                      <h2 className="text-xl sm:text-2xl font-black text-gray-900 dark:text-white leading-none">{MONTHS[monthIdx]}</h2>
                      <span className="text-xs sm:text-sm font-bold text-gray-400 dark:text-gray-500 tracking-widest mt-1">{year}</span>
                    </div>

                    <button onClick={() => setMonthIdx(m => m === 11 ? 0 : m + 1)} className="w-10 h-10 rounded-2xl bg-gray-50 dark:bg-gray-800 flex items-center justify-center font-bold hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer flex-shrink-0">›</button>
                  </div>

                  <div className="grid grid-cols-7 gap-1 sm:gap-2 md:gap-3 text-center text-[10px] sm:text-[11px] font-black text-gray-400 dark:text-gray-500">
                    {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(w => <div key={w}>{w}</div>)}
                  </div>

                  <div className="grid grid-cols-7 gap-1.5 sm:gap-2.5 md:gap-3 justify-items-center">
                    {calDays.map((d, idx) => {
                      if (!d) return <div key={idx} className="w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12" />;
                      const dStr = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                      const entry = leaves[dStr];
                      let style = { background: isDark ? '#1F2937' : '#F8FAFC', color: isDark ? '#D1D5DB' : '#334155' };

                      if (entry) {
                        if (entry.type === 'full') {
                          style = { background: getHex(entry.category), color: '#fff' };
                        } else if (entry.type === 'half') {
                          const h1 = entry.half1 ? getHex(entry.half1) : '#F1F5F9';
                          const h2 = entry.half2 ? getHex(entry.half2) : '#F1F5F9';
                          style = { background: `linear-gradient(90deg, ${h1} 50%, ${h2} 50%)`, color: '#fff' };
                        }
                      }

                      return (
                        <div key={dStr} style={style} onClick={() => handleDateClick(dStr, entry)} className="w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold text-xs sm:text-sm shadow-sm transition hover:scale-105 cursor-pointer">
                          <span>{d}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* KPI Grid (6 Cols Desktop) */}
                <div className="xl:col-span-6 space-y-3">
                  <span className="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest block px-1">ACCUMULATED ATTENDANCE & LEAVE METRICS</span>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {LEAVE_KEYS.map(k => {
                      const data = metrics[k];
                      return (
                        <div key={k} className="bg-white dark:bg-gray-900 rounded-3xl p-4 border border-gray-100 dark:border-gray-800 shadow-sm space-y-2 hover:shadow-md transition">
                          <div className="flex items-center space-x-2">
                            <div style={{ backgroundColor: getHex(k) }} className="w-2.5 h-2.5 rounded-full" />
                            <span className="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest truncate">{k} · {LEAVE_TYPES[k].name}</span>
                          </div>
                          <div className="text-2xl font-black text-gray-900 dark:text-white">{data.total.toFixed(1)} <span className="text-[10px] font-bold text-gray-400 dark:text-gray-500">DAYS</span></div>
                          <div className="text-[10px] font-semibold text-gray-400 dark:text-gray-500 flex justify-between pt-1 border-t border-gray-100 dark:border-gray-800">
                            <span>Full: {data.full}</span>
                            <span>Half: {data.half}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>

              {/* Footer with Divider Line */}
              <footer className="pt-6 md:pt-8 mt-8 md:mt-12 border-t border-gray-200 dark:border-gray-800 text-center text-xs font-medium text-gray-400 dark:text-gray-500 space-y-1">
                <p>© 2026 workaholic. All workdays accounted for. Zero attendance confusion, zero math headaches.</p>
                <p className="text-[11px]">Made by Taksheel Rawat · Attendance & Leave Tracker</p>
              </footer>
            </main>
          </div>

          {/* Modal */}
          {modal.open && (
            <ModalDialog
              dateStr={modal.dateStr}
              existing={modal.entry}
              onSave={handleSave}
              onReset={handleResetDay}
              onClose={() => setModal({ open: false, dateStr: null, entry: null })}
            />
          )}
        </div>
      );
    }

    function ModalDialog({ dateStr, existing, onSave, onReset, onClose }) {
      const [mode, setMode] = React.useState('full');
      const [cat, setCat] = React.useState('PL');
      const [half1Cat, setHalf1Cat] = React.useState('OFFICE');
      const [half2Cat, setHalf2Cat] = React.useState('OD');

      React.useEffect(() => {
        if (existing) {
          if (existing.type === 'full') {
            setMode('full');
            setCat(existing.category || 'PL');
          } else if (existing.type === 'half') {
            if (existing.half1 && existing.half2) {
              setMode('split');
              setHalf1Cat(existing.half1);
              setHalf2Cat(existing.half2);
            } else if (existing.half2) {
              setMode('half2');
              setCat(existing.half2);
            } else {
              setMode('half1');
              setCat(existing.half1 || 'SL');
            }
          }
        }
      }, [existing]);

      const submit = () => {
        if (mode === 'full') onSave(dateStr, { type: 'full', category: cat });
        else if (mode === 'half1') onSave(dateStr, { type: 'half', half1: cat, half2: null });
        else if (mode === 'half2') onSave(dateStr, { type: 'half', half1: null, half2: cat });
        else if (mode === 'split') onSave(dateStr, { type: 'half', half1: half1Cat, half2: half2Cat });
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white dark:bg-gray-900 rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl border border-gray-100 dark:border-gray-800 text-gray-900 dark:text-gray-100">
            <div className="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-gray-800">
              <h3 className="font-bold text-lg text-gray-900 dark:text-white">Configure Leave</h3>
              <button onClick={onClose} className="text-gray-400 font-bold hover:text-gray-600 dark:hover:text-gray-200">✕</button>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-xs font-bold text-gray-400 dark:text-gray-500 block mb-2 uppercase">1. Duration Allocation</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                  {[
                    { id: 'full', label: 'Full Day' },
                    { id: 'half1', label: '1st Half' },
                    { id: 'half2', label: '2nd Half' },
                    { id: 'split', label: 'Dual Half' }
                  ].map(item => (
                    <button key={item.id} onClick={() => setMode(item.id)} className={`p-2.5 rounded-xl border text-center font-bold ${mode === item.id ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400' : 'border-gray-200 dark:border-gray-700'}`}>
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              {mode === 'split' ? (
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-gray-400 dark:text-gray-500 block mb-1 uppercase">2A. 1st Half Category (Left Half)</label>
                    <div className="relative">
                      <select
                        value={half1Cat}
                        onChange={e => setHalf1Cat(e.target.value)}
                        className="w-full appearance-none pl-4 pr-10 py-2.5 text-xs rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-semibold cursor-pointer shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        {DROPDOWN_KEYS.map(k => <option key={k} value={k}>{LEAVE_TYPES[k].name} ({k})</option>)}
                      </select>
                      <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 dark:text-gray-400">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                        </svg>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-gray-400 dark:text-gray-500 block mb-1 uppercase">2B. 2nd Half Category (Right Half)</label>
                    <div className="relative">
                      <select
                        value={half2Cat}
                        onChange={e => setHalf2Cat(e.target.value)}
                        className="w-full appearance-none pl-4 pr-10 py-2.5 text-xs rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-semibold cursor-pointer shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        {DROPDOWN_KEYS.map(k => <option key={k} value={k}>{LEAVE_TYPES[k].name} ({k})</option>)}
                      </select>
                      <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 dark:text-gray-400">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                        </svg>
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div>
                  <label className="text-xs font-bold text-gray-400 dark:text-gray-500 block mb-2 uppercase">
                    {mode === 'half1' ? '2. Select 1st Half Category (Left Half)' : mode === 'half2' ? '2. Select 2nd Half Category (Right Half)' : '2. Select Leave Category'}
                  </label>
                  <div className="relative">
                    <select
                      value={cat}
                      onChange={e => setCat(e.target.value)}
                      className="w-full appearance-none pl-4 pr-10 py-3 text-xs rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-semibold cursor-pointer shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      {DROPDOWN_KEYS.map(k => <option key={k} value={k}>{LEAVE_TYPES[k].name} ({k})</option>)}
                    </select>
                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 dark:text-gray-400">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                      </svg>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-800">
              {existing ? (
                <button
                  type="button"
                  onClick={() => onReset(dateStr)}
                  title="Reset Day"
                  className="w-10 h-10 rounded-full text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-950/60 bg-red-50 dark:bg-red-950/30 transition cursor-pointer flex items-center justify-center shadow-sm active:scale-95"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </button>
              ) : <div className="w-10 h-10" />}
              <div className="flex items-center space-x-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition cursor-pointer"
                >
                  Cancel
                </button>
                <button
                  type="button"
                  onClick={submit}
                  title={existing ? 'Update' : 'Save'}
                  className="w-10 h-10 rounded-full bg-indigo-600 text-white font-bold shadow-md shadow-indigo-500/20 hover:bg-indigo-700 transition flex items-center justify-center cursor-pointer active:scale-95"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
